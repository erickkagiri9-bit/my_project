<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Interactive Buttons</title>

  <link rel="stylesheet" href="style.css">

  <!-- ICONS -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

</head>

<body>

  <div class="background"></div>

  <div class="container">

    <h1>
      Modern Interactive Buttons
    </h1>

    <div class="button-grid">

      <!-- BUTTON 1 -->

      <button class="btn gradient-btn">

        <i class="fa-solid fa-bolt"></i>

        Gradient Button

      </button>

      <!-- BUTTON 2 -->

      <button class="btn glow-btn">

        <i class="fa-solid fa-fire"></i>

        Glow Effect

      </button>

      <!-- BUTTON 3 -->

      <button class="btn liquid-btn">

        <span>Liquid Hover</span>

      </button>

      <!-- BUTTON 4 -->

      <button class="btn neon-btn">

        <i class="fa-solid fa-star"></i>

        Neon Button

      </button>

      <!-- BUTTON 5 -->

      <button class="btn glass-btn">

        <i class="fa-solid fa-gem"></i>

        Glass Button

      </button>

      <!-- BUTTON 6 -->

      <button class="btn pulse-btn">

        <i class="fa-solid fa-heart"></i>

        Pulse Button

      </button>

    </div>

  </div>

<script src="button.js"></script>
</body>
</html>
