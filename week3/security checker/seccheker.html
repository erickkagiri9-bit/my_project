<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Password Strength Checker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
    }

    .container {
      background: white;
      width: 400px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
    }

    .strength-meter {
      height: 10px;
      width: 100%;
      background: #ddd;
      border-radius: 5px;
      margin-top: 15px;
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0%;
      transition: 0.4s;
      border-radius: 5px;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }

    .requirements {
      margin-top: 20px;
      list-style: none;
    }

    .requirements li {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .valid {
      color: green;
    }

    .invalid {
      color: red;
    }

  </style>
</head>
<body>

  <div class="container">
    <h2>Password Strength Checker</h2>

    <div class="input-group">
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <div class="strength-meter">
      <div class="strength-bar" id="strengthBar"></div>
    </div>

    <div class="message" id="message"></div>

    <ul class="requirements">
      <li id="length" class="invalid">❌ At least 8 characters</li>
      <li id="uppercase" class="invalid">❌ Uppercase letter</li>
      <li id="lowercase" class="invalid">❌ Lowercase letter</li>
      <li id="number" class="invalid">❌ Number</li>
      <li id="special" class="invalid">❌ Special character</li>
    </ul>
  </div>

  <script>
    const password = document.getElementById("password");
    const strengthBar = document.getElementById("strengthBar");
    const message = document.getElementById("message");

    password.addEventListener("keyup", checkPasswordStrength);

    function checkPasswordStrength() {
      const value = password.value;

      let strength = 0;

      // Requirements
      const hasLength = value.length >= 8;
      const hasUppercase = /[A-Z]/.test(value);
      const hasLowercase = /[a-z]/.test(value);
      const hasNumber = /[0-9]/.test(value);
      const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(value);

      updateRequirement("length", hasLength);
      updateRequirement("uppercase", hasUppercase);
      updateRequirement("lowercase", hasLowercase);
      updateRequirement("number", hasNumber);
      updateRequirement("special", hasSpecial);

      // Calculate strength
      if (hasLength) strength++;
      if (hasUppercase) strength++;
      if (hasLowercase) strength++;
      if (hasNumber) strength++;
      if (hasSpecial) strength++;

      // Strength levels
      switch (strength) {
        case 0:
        case 1:
          strengthBar.style.width = "20%";
          strengthBar.style.background = "red";
          message.textContent = "Weak Password";
          message.style.color = "red";
          break;

        case 2:
        case 3:
          strengthBar.style.width = "60%";
          strengthBar.style.background = "orange";
          message.textContent = "Medium Password";
          message.style.color = "orange";
          break;

        case 4:
        case 5:
          strengthBar.style.width = "100%";
          strengthBar.style.background = "green";
          message.textContent = "Strong Password";
          message.style.color = "green";
          break;
      }

      // Empty input
      if (value.length === 0) {
        strengthBar.style.width = "0";
        message.textContent = "";
      }
    }

    function updateRequirement(id, valid) {
      const element = document.getElementById(id);

      if (valid) {
        element.classList.remove("invalid");
        element.classList.add("valid");
        element.innerHTML = element.innerHTML.replace("❌", "✅");
      } else {
        element.classList.remove("valid");
        element.classList.add("invalid");
        element.innerHTML = element.innerHTML.replace("✅", "❌");
      }
    }
  </script>

</body>
</html>
